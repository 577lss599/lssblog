<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梁树帅 | 首页封面</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<!--
  封面页（首页第一屏）· 梁树帅
  风格参考：全屏深色背景 + 圆形头像 + 玻璃拟态卡片 + 实时时钟 + 入口网格
  点击「进入个人主页」或任意入口卡片，进入 index.html 对应模块。
  CSS 全部在内部 style 标签中，JavaScript 全部在底部 script 标签中。
-->
<style>
/* ================= 主题变量 ================= */
:root{
  --bg-1:#0a1220;
  --bg-2:#101a2e;
  --bg-3:#060a12;
  --glass:rgba(255,255,255,.075);
  --glass-2:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.16);
  --text:#eaf1fb;
  --title:#ffffff;
  --muted:#a9bad2;
  --brand:#2dd4bf;
  --brand-2:#38bdf8;
  --on-brand:#04121a;
  --glow-1:rgba(45,212,191,.28);
  --glow-2:rgba(56,189,248,.22);
  --warm:rgba(255,132,90,.20);          /* 背景夕阳暖光 */
}

/* ================= 基础 ================= */
*{ margin:0; padding:0; box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  min-height:100vh;
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  color:var(--text);
  line-height:1.75;
  background:var(--bg-3);
  overflow-x:hidden;
}
/* 全屏背景：深蓝夜空 + 夕阳暖光 + 青蓝辉光，全部纯 CSS 渐变 */
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  background:
    radial-gradient(62vw 52vw at 8% 12%,  var(--warm),  transparent 58%),
    radial-gradient(58vw 50vw at 88% 6%,  var(--glow-2), transparent 60%),
    radial-gradient(46vw 38vw at 80% 88%, var(--warm),  transparent 64%),
    radial-gradient(70vw 60vw at 46% 104%, var(--glow-1), transparent 66%),
    linear-gradient(165deg, var(--bg-2) 0%, var(--bg-1) 52%, var(--bg-3) 100%);
  pointer-events:none;
}
/* 顶部一层柔和的雾化，模拟远处云层 */
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:radial-gradient(90vw 40vw at 50% 0%, rgba(255,255,255,.07), transparent 70%);
}
img{ display:block; max-width:100%; }

/* 玻璃拟态卡片通用样式 */
.glass{
  background:var(--glass);
  border:1px solid var(--line);
  border-radius:20px;
  backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  box-shadow:0 22px 54px -24px rgba(0,0,0,.85);
}

/* ================= 舞台布局 ================= */
.stage{
  position:relative;
  z-index:1;
  min-height:100vh;
  max-width:1180px;
  margin:0 auto;
  padding:56px 28px 28px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.stage-inner{
  display:flex;
  flex-wrap:wrap;
  gap:56px;
  align-items:center;
}

/* ---------- 左栏：头像 + 站名 + 签名 + 图标 ---------- */
.col-left{
  flex:1 1 400px;
  min-width:0;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:8px 18px;
  font-size:13.5px;
  color:var(--muted);
  border-radius:999px;
  background:var(--glass);
  border:1px solid var(--line);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.pill i{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--brand);
  box-shadow:0 0 10px var(--brand);
}

/* 头像 + 手写体站名并排 */
.brand{
  display:flex;
  align-items:center;
  gap:20px;
  margin:28px 0 26px;
}
.ring{
  flex:none;
  width:110px;
  height:110px;
  padding:4px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--title),var(--line));
  box-shadow:0 0 0 10px var(--glass), 0 18px 40px -16px var(--glow-1);
}
.ring img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  object-position:center 16%;
}
.brand-name{
  font-family:"Segoe Script","Brush Script MT","Lucida Handwriting",cursive;
  font-size:clamp(26px,3.6vw,38px);
  font-weight:400;
  color:var(--title);
  line-height:1.15;
  text-shadow:0 6px 26px var(--glow-1);
  letter-spacing:.5px;
}
.brand-name span{
  display:inline-block;
  margin-left:8px;
  color:var(--brand);
  font-size:.62em;
  letter-spacing:0;
}
.brand-sub{
  margin-top:6px;
  font-size:14px;
  color:var(--muted);
  letter-spacing:1px;
}

/* 引用式签名玻璃卡 */
.quote{
  position:relative;
  padding:22px 26px 22px 30px;
  max-width:460px;
}
.quote::before{
  content:"“";
  position:absolute;
  left:8px;
  top:2px;
  font-family:Georgia,serif;
  font-size:52px;
  line-height:1;
  color:var(--line);
}
.quote strong{
  display:block;
  font-family:"Segoe Script","Brush Script MT","Lucida Handwriting",cursive;
  font-size:24px;
  font-weight:400;
  color:var(--title);
  margin-bottom:8px;
}
.quote p{
  font-size:14.5px;
  color:var(--muted);
  padding-left:2px;
}

/* 社交图标行 */
.socials{
  display:flex;
  gap:12px;
  margin-top:26px;
  flex-wrap:wrap;
}
.socials a{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  border-radius:50%;
  text-decoration:none;
  background:var(--glass);
  border:1px solid var(--line);
  transition:transform .28s ease, color .28s ease, background .28s ease, border-color .28s ease;
}
.socials a:hover{
  color:var(--on-brand);
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  border-color:transparent;
  transform:translateY(-4px);
}
.socials svg{ width:19px; height:19px; }

/* ---------- 右栏：时钟 + 入口网格 ---------- */
.col-right{
  flex:1 1 420px;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:18px;
}

/* 实时时钟卡 */
.clock-card{
  padding:20px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  flex-wrap:wrap;
}
.clock-left small{
  display:block;
  font-size:12.5px;
  color:var(--muted);
  letter-spacing:.5px;
}
.clock-time{
  font-size:clamp(30px,4vw,40px);
  font-weight:700;
  line-height:1.2;
  color:var(--title);
  letter-spacing:2px;
  font-variant-numeric:tabular-nums;
}
.clock-right{
  text-align:right;
  font-size:12.5px;
  color:var(--muted);
  line-height:1.9;
}

/* 入口网格：玻璃卡片 */
.entry-grid{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
}
.entry{
  flex:1 1 calc(50% - 7px);
  min-width:0;
  padding:18px 18px 16px;
  text-decoration:none;
  color:var(--text);
  transition:transform .3s ease, background .3s ease, border-color .3s ease, box-shadow .3s ease;
}
.entry:hover{
  transform:translateY(-6px);
  background:var(--glass-2);
  border-color:var(--brand);
  box-shadow:0 26px 50px -22px var(--glow-1);
}
.entry svg{
  width:22px;
  height:22px;
  color:var(--brand);
  margin-bottom:10px;
}
.entry b{
  display:block;
  font-size:15.5px;
  font-weight:600;
  color:var(--title);
}
.entry span{
  display:block;
  margin-top:3px;
  font-size:12.5px;
  color:var(--muted);
}

/* 进入主页按钮 */
.enter-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:15px 20px;
  font-size:15.5px;
  font-weight:600;
  letter-spacing:1px;
  text-decoration:none;
  color:var(--on-brand);
  border-radius:999px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  box-shadow:0 18px 40px -16px var(--glow-1);
  transition:transform .28s ease, filter .28s ease, box-shadow .28s ease;
}
.enter-btn:hover{
  transform:translateY(-3px);
  filter:brightness(1.07);
  box-shadow:0 24px 48px -16px var(--glow-1);
}

/* ================= 页脚 ================= */
.cover-footer{
  position:relative;
  z-index:1;
  text-align:center;
  padding:26px 20px 30px;
  font-size:12.5px;
  color:var(--muted);
  letter-spacing:.4px;
}
.cover-footer span{ color:var(--brand); }

/* ================= 入场动画 ================= */
@keyframes rise{
  from{ opacity:.35; transform:translateY(18px); }
  to  { opacity:1;   transform:translateY(0); }
}
.rise{ animation:rise .6s ease; }

/* ================= 响应式 ================= */
@media (max-width:920px){
  .stage{ padding:40px 20px 20px; }
  .stage-inner{ gap:36px; }
  .brand{ margin:22px 0 20px; }
  .ring{ width:92px; height:92px; }
  .quote{ max-width:none; }
  .clock-card{ justify-content:flex-start; }
  .clock-right{ text-align:left; }
}
@media (max-width:480px){
  .entry{ flex:1 1 100%; }
  .clock-time{ font-size:30px; }
}
</style>
</head>
<body>

<main class="stage">
  <div class="stage-inner">

    <!-- ============ 左栏：头像 + 站名 + 签名 + 图标 ============ -->
    <div class="col-left">

      <div class="pill rise"><i></i> 你好，欢迎来到我的个人主页</div>

            <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>

      </div>
    </div>

    <!-- ============ 右栏：时钟 + 入口网格 + 进入按钮 ============ -->
    <div class="col-right">

      <!-- 实时时钟，由底部 JavaScript 每秒更新 -->

      <!-- 入口网格：玻璃卡片，点击进入主页对应模块 -->
      <div class="entry-grid">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

        <a class="entry glass rise" href="home.html#contact">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

</main>

<footer class="cover-footer">
  Copyright &copy; 2026 <span>梁树帅</span> · 个人主页 · 保留所有权利
</footer>

<script>
/* ================= 封面页：实时时钟 ================= */
var weekNames = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

function pad(n){
  return n < 10 ? '0' + n : '' + n;
}

function updateClock(){
  var now = new Date();
  var dateText = now.getFullYear() + ' 年 ' + (now.getMonth() + 1) + ' 月 ' + now.getDate() + ' 日 ' + weekNames[now.getDay()];
  var timeText = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());

  document.getElementById('clockDate').textContent = dateText;
  document.getElementById('clockTime').textContent = timeText;
}

updateClock();                 // 首屏立即显示
setInterval(updateClock, 1000); // 每秒刷新
</script>
</body>
</html>
